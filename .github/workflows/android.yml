name: Android ARM64

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android project
        run: npm run android:init

      - name: Build installable ARM64 debug APK
        run: npm run android:build:debug

      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: nscb-desktop-android-arm64-installable
          path: src-tauri/gen/android/app/build/outputs/apk/**/*debug.apk
          if-no-files-found: error
